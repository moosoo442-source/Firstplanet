<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
<title>CharaWiki v3.3</title>
<link rel="stylesheet" href="style.css" />
</head>
<body data-theme="light" data-font="modern" data-infobox="classic" data-layout="right" data-pattern="none" data-divider="solid">
  <div id="readBar"></div>

  <button id="sidebarToggle" class="icon-btn" aria-label="사이드바 열기">☰</button>

  <aside id="sidebar">
    <div class="sb-head">
      <h2>📚 캐릭터</h2>
      <button id="addCharBtn" class="btn-sm">+ 새 캐릭터</button>
    </div>
    <input id="charSearch" type="search" placeholder="🔍 검색..." />
    <ul id="charList"></ul>
    <div class="sb-foot">
      <button id="exportBtn" class="btn-sm">⬇ 백업</button>
      <button id="importBtn" class="btn-sm">⬆ 불러오기</button>
      <button id="shareBtn" class="btn-sm">🔗 공유</button>
      <input type="file" id="importFile" accept=".json" hidden />
    </div>
  </aside>

  <div id="sidebarOverlay"></div>

  <main id="main">
    <header id="topbar">
      <button id="editToggle" class="btn-primary">✏️ 편집</button>
      <button id="saveBtn" class="btn-sm" title="Ctrl+S">💾 저장</button>
      <div class="spacer"></div>
      <button id="themeBtn" class="icon-btn" title="테마">🎨</button>
      <button id="decoBtn" class="icon-btn" title="꾸미기">✨</button>
    </header>

    <div id="cover"></div>

    <article id="article">
      <div id="titleBlock">
        <div id="avatar"></div>
        <div>
          <h1 id="title" data-edit="title">캐릭터 이름</h1>
          <p id="subtitle" data-edit="subtitle">부제목</p>
          <div id="tags"></div>
        </div>
      </div>

      <div id="tabs"></div>

      <div id="pageBody">
        <aside id="infobox"></aside>
        <div id="sections"></div>
      </div>

      <nav id="toc"></nav>
    </article>

    <button id="topBtn" class="icon-btn" title="맨 위로">▲</button>
  </main>

  <!-- 패널들 -->
  <div id="themePanel" class="panel hidden">
    <h3>🎨 테마</h3>
    <div class="theme-grid">
      <button data-theme="light">라이트</button>
      <button data-theme="dark">다크</button>
      <button data-theme="sepia">세피아</button>
      <button data-theme="pink">핑크</button>
      <button data-theme="mint">민트</button>
      <button data-theme="navy">네이비</button>
      <button data-theme="galaxy">갤럭시</button>
      <button data-theme="retro">레트로</button>
    </div>
    <h4>강조 색상</h4>
    <div id="accentRow" class="accent-row">
      <button data-accent="#3b82f6" style="background:#3b82f6"></button>
      <button data-accent="#ef4444" style="background:#ef4444"></button>
      <button data-accent="#10b981" style="background:#10b981"></button>
      <button data-accent="#f59e0b" style="background:#f59e0b"></button>
      <button data-accent="#8b5cf6" style="background:#8b5cf6"></button>
      <button data-accent="#ec4899" style="background:#ec4899"></button>
      <button data-accent="#06b6d4" style="background:#06b6d4"></button>
      <input type="color" id="accentPicker" />
    </div>
    <h4>폰트</h4>
    <div class="row">
      <button data-font="modern">모던</button>
      <button data-font="serif">명조</button>
      <button data-font="mono">모노</button>
    </div>
    <h4>글자 크기 <span id="fsLabel">15</span>px</h4>
    <input type="range" id="fontSize" min="13" max="20" value="15" />
  </div>

  <div id="decoPanel" class="panel hidden">
    <h3>✨ 꾸미기</h3>
    <h4>인포박스</h4>
    <div class="row">
      <button data-infobox="classic">클래식</button>
      <button data-infobox="card">카드</button>
      <button data-infobox="minimal">미니멀</button>
    </div>
    <h4>레이아웃</h4>
    <div class="row">
      <button data-layout="right">우측</button>
      <button data-layout="left">좌측</button>
      <button data-layout="top">상단</button>
    </div>
    <h4>배경 패턴</h4>
    <div class="row">
      <button data-pattern="none">없음</button>
      <button data-pattern="grid">격자</button>
      <button data-pattern="dot">도트</button>
      <button data-pattern="stripe">줄무늬</button>
    </div>
    <h4>구분선</h4>
    <div class="row">
      <button data-divider="solid">실선</button>
      <button data-divider="dashed">점선</button>
      <button data-divider="grad">그라데이션</button>
      <button data-divider="none">없음</button>
    </div>
    <h4>커버 / 아바타</h4>
    <div class="row">
      <label class="btn-sm">커버 업로드<input type="file" id="coverUpload" accept="image/*" hidden /></label>
      <button id="coverRemove" class="btn-sm">커버 제거</button>
      <label class="btn-sm">아바타 업로드<input type="file" id="avatarUpload" accept="image/*" hidden /></label>
    </div>
  </div>

  <!-- 라이트박스 -->
  <div id="lightbox" class="hidden"><img id="lbImg" alt="" /></div>

  <!-- 토스트 -->
  <div id="toast" class="hidden"></div>

  <!-- 이모지 팝업 -->
  <div id="emojiPop" class="panel hidden">
    <div id="emojiGrid"></div>
  </div>

  <script src="script.js"></script>
</body>
</html>
